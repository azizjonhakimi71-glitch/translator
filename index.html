<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Переводчик">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1214">
<title>Живой переводчик</title>
<style>
  :root {
    --bg: #0f1214;
    --surface: #181c20;
    --fg: #eceff1;
    --muted: #94a0a9;
    --line: #2b3238;
    --seal: #ff6a52;
    --seal-fg: #1a0a07;
    --jade: #5cc4ad;
    --err: #ff8a80;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font-family: -apple-system, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
    font-size: 16px; line-height: 1.5;
    padding: max(18px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(40px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  main { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-size: 1.4rem; margin: 0; line-height: 1.15; }
  .sub { color: var(--muted); margin: 4px 0 0; font-size: 0.92rem; }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 8px 0; }
  .pill { font-size: 0.85rem; font-weight: 600; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .pill.on { color: var(--jade); border-color: var(--jade); }
  .pill.busy { color: var(--seal); border-color: var(--seal); }
  #big {
    width: 148px; height: 148px; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--seal); color: var(--seal-fg); font: inherit; font-size: 1.15rem; font-weight: 800;
    box-shadow: 0 0 0 8px rgba(255, 106, 82, 0.18);
  }
  #big.live { background: var(--surface); color: var(--fg); box-shadow: 0 0 0 8px rgba(92, 196, 173, 0.25); border: 2px solid var(--jade); }
  #big:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--jade); outline-offset: 3px; }
  .interim { min-height: 2.6em; color: var(--muted); text-align: center; font-size: 1.05rem; overflow-wrap: anywhere; }
  .msg { color: var(--err); text-align: center; font-size: 0.92rem; min-height: 1.4em; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px; }
  .card .src { color: var(--muted); font-size: 0.95rem; overflow-wrap: anywhere; }
  .card .ru { font-weight: 800; font-size: 1.15rem; overflow-wrap: anywhere; }
  .card .ru.wait { color: var(--muted); font-weight: 400; }
  .hide-src .card .src { display: none; }
  details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; }
  summary { min-height: 50px; display: flex; align-items: center; cursor: pointer; font-weight: 700; }
  .set { display: flex; flex-direction: column; gap: 12px; padding-bottom: 16px; }
  label { font-size: 0.9rem; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  label.check { flex-direction: row; align-items: center; gap: 10px; min-height: 40px; }
  input[type="password"], input[type="text"], select {
    font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; min-height: 46px; width: 100%;
  }
  .btn { font: inherit; font-weight: 700; min-height: 46px; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .note { color: var(--muted); font-size: 0.85rem; margin: 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Живой переводчик</h1>
    <p class="sub">Слушает речь, переводит на русский и говорит перевод в наушники очков.</p>
  </header>

  <section class="stage">
    <div class="pill" id="pill">Остановлен</div>
    <button id="big">Старт</button>
    <div class="interim" id="interim" aria-live="polite"></div>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </section>

  <section class="list" id="list" aria-live="polite"></section>

  <details id="settings">
    <summary>Настройки</summary>
    <div class="set">
      <label>Ключ Claude API
        <input type="password" id="key" placeholder="sk-ant-..." autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <div class="row"><button class="btn" id="saveKey">Сохранить ключ</button><button class="btn" id="clearKey">Удалить ключ</button></div>
      <p class="note">Ключ хранится только в памяти этого телефона и уходит только в Anthropic.</p>
      <label>Какой язык слушать
        <select id="src">
          <option value="zh-CN">Китайский</option>
          <option value="en-US">Английский</option>
          <option value="ja-JP">Японский</option>
          <option value="ko-KR">Корейский</option>
        </select>
      </label>
      <label>Голос
        <select id="voice"></select>
      </label>
      <label>Скорость голоса
        <select id="rate">
          <option value="0.9">Медленно</option>
          <option value="1" selected>Обычно</option>
          <option value="1.15">Быстро</option>
          <option value="1.3">Очень быстро</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="showSrc" checked> Показывать оригинал</label>
      <div class="row"><button class="btn" id="testVoice">Проверить голос</button><button class="btn" id="clearList">Очистить список</button></div>
      <p class="note">Пока звучит перевод, микрофон выключен, чтобы переводчик не слушал сам себя.</p>
    </div>
  </details>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var LANG_NAME = { 'zh-CN': 'китайского', 'en-US': 'английского', 'ja-JP': 'японского', 'ko-KR': 'корейского' };
  var MODEL = 'claude-haiku-5-5';
  var running = false, paused = false, rec = null, pendingSpeech = 0, wake = null;
  var recent = [];

  function store(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* ignore */ } }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  function setPill(text, cls) { $('pill').textContent = text; $('pill').className = 'pill ' + (cls || ''); }
  function setMsg(t) { $('msg').textContent = t || ''; }

  // Settings
  $('key').value = load('lt-key') || '';
  $('src').value = load('lt-src') || 'zh-CN';
  $('rate').value = load('lt-rate') || '1';
  $('showSrc').checked = load('lt-showsrc') !== '0';
  document.body.classList.toggle('hide-src', !$('showSrc').checked);
  $('src').onchange = function () { store('lt-src', $('src').value); };
  $('rate').onchange = function () { store('lt-rate', $('rate').value); };
  $('showSrc').onchange = function () {
    store('lt-showsrc', $('showSrc').checked ? '1' : '0');
    document.body.classList.toggle('hide-src', !$('showSrc').checked);
  };
  $('saveKey').onclick = function () { store('lt-key', $('key').value.trim()); setMsg('Ключ сохранён.'); };
  $('clearKey').onclick = function () { store('lt-key', null); $('key').value = ''; setMsg('Ключ удалён.'); };
  $('clearList').onclick = function () { $('list').textContent = ''; recent = []; };

  if (!SR) {
    setMsg('Этот браузер не умеет распознавать речь. Откройте страницу в Safari на iPhone.');
    $('big').disabled = true;
  }

  // Voices
  var FEMALE = /milena|katya|alena|irina|svetlana|tatyana|anna|elena|yulia|female|женск/i;
  function fillVoices() {
    var all = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    var ru = all.filter(function (v) { return /^ru/i.test(v.lang); });
    var sel = $('voice');
    sel.textContent = '';
    if (!ru.length) {
      var o = document.createElement('option');
      o.textContent = 'Русский голос не найден';
      sel.append(o);
      return;
    }
    var saved = load('lt-voice');
    var pick = ru.find(function (v) { return v.voiceURI === saved; }) || ru.find(function (v) { return FEMALE.test(v.name); }) || ru[0];
    ru.forEach(function (v) {
      var op = document.createElement('option');
      op.value = v.voiceURI;
      op.textContent = v.name + (FEMALE.test(v.name) ? ' (женский)' : '');
      if (v === pick) op.selected = true;
      sel.append(op);
    });
  }
  if (window.speechSynthesis) {
    fillVoices();
    speechSynthesis.onvoiceschanged = fillVoices;
  }
  $('voice').onchange = function () { store('lt-voice', $('voice').value); };
  function currentVoice() {
    var all = speechSynthesis.getVoices();
    return all.find(function (v) { return v.voiceURI === $('voice').value; }) || all.find(function (v) { return /^ru/i.test(v.lang); }) || null;
  }

  // Speaking: the microphone is paused while the translation plays
  function speak(text) {
    if (!window.speechSynthesis || !text) return;
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ru-RU';
    var v = currentVoice();
    if (v) u.voice = v;
    u.rate = parseFloat($('rate').value) || 1;
    pendingSpeech++;
    u.onstart = function () {
      paused = true;
      if (rec) { try { rec.stop(); } catch (e) { /* ignore */ } }
      setPill('Говорю перевод', 'busy');
    };
    var done = function () {
      pendingSpeech = Math.max(0, pendingSpeech - 1);
      if (pendingSpeech === 0) {
        paused = false;
        if (running) { setPill('Слушаю', 'on'); startListening(); }
      }
    };
    u.onend = done;
    u.onerror = done;
    speechSynthesis.speak(u);
  }
  $('testVoice').onclick = function () {
    unlock();
    speak('Привет! Это голос вашего переводчика. Я буду говорить перевод в наушники очков.');
  };
  function unlock() {
    if (!window.speechSynthesis) return;
    try { var u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) { /* ignore */ }
  }

  // Translation through the Claude API
  function translate(text) {
    var key = load('lt-key');
    if (!key) return Promise.reject({ code: 'nokey' });
    var lang = LANG_NAME[$('src').value] || 'китайского';
    var ctx = recent.length ? 'Предыдущие фразы (только контекст):\n' + recent.join('\n') + '\n\n' : '';
    return fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 400,
        system: 'Ты синхронный переводчик с ' + lang + ' языка на русский. Переводи естественной разговорной речью, коротко, как живой человек. Выводи только перевод, без пояснений и кавычек. Если фраза обрывочная или неразборчивая, переводи как есть, ничего не придумывай. Имена и числа передавай точно.',
        messages: [{ role: 'user', content: ctx + 'Переведи фразу:\n' + text }]
      })
    }).then(function (r) {
      if (!r.ok) return Promise.reject({ code: r.status });
      return r.json();
    }).then(function (data) {
      var t = data && data.content && data.content[0] && data.content[0].text;
      if (!t) return Promise.reject({ code: 'empty' });
      return t.trim();
    });
  }
  function errText(e) {
    var c = e && e.code;
    if (c === 'nokey') return 'Добавьте ключ Claude API в настройках.';
    if (c === 401 || c === 403) return 'Ключ не подошёл. Проверьте его в настройках.';
    if (c === 429) return 'Слишком много запросов или закончился лимит.';
    if (c === 404 || c === 400) return 'Запрос не принят. Проверьте ключ и модель.';
    return 'Нет связи с переводчиком. Проверьте интернет.';
  }

  function addCard(src) {
    var card = document.createElement('article');
    card.className = 'card';
    var s = document.createElement('div'); s.className = 'src'; s.textContent = src;
    var r = document.createElement('div'); r.className = 'ru wait'; r.textContent = 'Перевожу…';
    card.append(s, r);
    $('list').prepend(card);
    return r;
  }

  function onPhrase(text) {
    var out = addCard(text);
    setPill('Перевожу', 'busy');
    translate(text).then(function (ru) {
      out.textContent = ru;
      out.className = 'ru';
      recent.push(text + ' → ' + ru);
      if (recent.length > 3) recent.shift();
      if (pendingSpeech === 0) setPill('Слушаю', 'on');
      speak(ru);
    }).catch(function (e) {
      out.textContent = errText(e);
      out.className = 'ru wait';
      setMsg(errText(e));
      if (pendingSpeech === 0 && running) setPill('Слушаю', 'on');
    });
  }

  // Listening
  function startListening() {
    if (!SR || !running || paused) return;
    var r = new SR();
    rec = r;
    r.lang = $('src').value;
    r.continuous = true;
    r.interimResults = true;
    r.onresult = function (e) {
      var interim = '';
      for (var i = e.resultIndex; i < e.results.length; i++) {
        var res = e.results[i];
        var t = res[0].transcript;
        if (res.isFinal) {
          t = t.trim();
          if (t) onPhrase(t);
          $('interim').textContent = '';
        } else {
          interim += t;
        }
      }
      if (interim) $('interim').textContent = interim;
    };
    r.onerror = function (e) {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        running = false;
        setMsg('Нет доступа к микрофону. Разрешите его в настройках Safari для этого сайта.');
        stopUi();
      }
    };
    r.onend = function () {
      if (rec === r) rec = null;
      if (running && !paused) setTimeout(startListening, 250);
    };
    try { r.start(); } catch (e) { /* already started */ }
  }

  function stopUi() {
    $('big').textContent = 'Старт';
    $('big').classList.remove('live');
    setPill('Остановлен', '');
    $('interim').textContent = '';
  }

  async function keepAwake(on) {
    try {
      if (on && navigator.wakeLock) wake = await navigator.wakeLock.request('screen');
      else if (wake) { await wake.release(); wake = null; }
    } catch (e) { /* ignore */ }
  }

  $('big').onclick = function () {
    if (running) {
      running = false;
      paused = false;
      if (rec) { try { rec.stop(); } catch (e) { /* ignore */ } }
      try { speechSynthesis.cancel(); } catch (e) { /* ignore */ }
      pendingSpeech = 0;
      keepAwake(false);
      stopUi();
      return;
    }
    if (!load('lt-key')) {
      setMsg('Добавьте ключ Claude API в настройках.');
      $('settings').open = true;
      return;
    }
    setMsg('');
    unlock();
    running = true;
    $('big').textContent = 'Стоп';
    $('big').classList.add('live');
    setPill('Слушаю', 'on');
    keepAwake(true);
    startListening();
  };
  document.addEventListener('visibilitychange', function () {
    if (running && document.visibilityState === 'visible') keepAwake(true);
  });
})();
</script>
</body>
</html>
